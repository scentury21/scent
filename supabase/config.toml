# SCENTURY21 — Supabase project config (minimal).
# telegram-agent is a Telegram webhook: Telegram calls it with no JWT, so JWT
# verification must be OFF for it. Security is enforced inside the function by
# the x-telegram-bot-api-secret-token check (fail-closed), not by the gateway.
[functions.telegram-agent]
verify_jwt = false

# Daily 8am store report pushed to the owner's Telegram chat.
# Note: this schedule uses the legacy pg_cron approach. After deploying, verify
# the cron job exists: Dashboard → Database → Cron (or run
# `select * from cron.job;` in the SQL editor). If not, add it manually:
#   select cron.schedule('telegram-daily-report', '0 8 * * *', $$select net.http_post(url:='https://<ref>.supabase.co/functions/v1/telegram-daily-report', headers:='{"authorization":"Bearer <TELEGRAM_AGENT_SECRET>"}'::jsonb)$$);
[functions.telegram-daily-report]
verify_jwt = false
